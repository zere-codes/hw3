{% extends 'main/base.html' %}
{% load django_bootstrap5 %}

{% block title %}Публикация приложения - AppStore{% endblock %}

{% block content %}
    <form method="post" action="{% url 'main:add_app' %}" enctype="multipart/form-data">
        {% csrf_token %}
         {% bootstrap_form form %}

        <button type="submit" class="btn btn-primary">Добавить</button>
    </form>

{% endblock %}
