{% extends 'main/base.html' %}

{% block title %}Новый пароль - AppStore{% endblock %}

{% block content %}
    <h2>Задайте новый пароль</h2>
    {% if validlink %}
        <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Поменять пароль</button>
        </form>
    {% else %}
        <p>Ссылка недействительна</p>
        <p><a href="{% url 'main:password_reset' %}">Запросить письмо ещё раз</a></p>
    {% endif %}
{% endblock %}
