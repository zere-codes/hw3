{% extends 'main/base.html' %}

{% block title %}Разработчик {{developer.username}} - AppStore{% endblock %}

{% block content %}

<h1>Приложения разработчика {{developer.username}} </h1>

{%for app in apps%}
    <p><a href="{%url 'main:app_detail' app.id app.name%}">{{app.name}}</a></p>
{%endfor%}
{% endblock %}
