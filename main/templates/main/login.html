{% extends 'main/base.html' %}

{% block title %}Вход - AppStore{% endblock %}
{% load django_bootstrap5 %}
{% block content %}
    <h2>Вход</h2>
    <p>Зайдите в аккаунт</p>
    <form method="post" action="{% url 'main:login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{next}}">
        {% bootstrap_form form %}

        <button type="submit" class="btn btn-primary">Войти</button>
    </form>

    <p>Нет аккаунта? <a href="{% url 'main:register' %}">Зарегистрироваться</a></p>
    <p>Забыли пароль? <a href="{% url 'main:password_reset' %}">Сбросить пароль</a></p>


{% endblock %}
